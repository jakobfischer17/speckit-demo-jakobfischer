name: Secret Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history so PRs scan all new commits.

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          # Detected secrets fail the job and block merge.
          GITLEAKS_CONFIG: .gitleaks.toml
